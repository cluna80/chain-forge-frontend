# Chain Forge engine workspace (Batch 1 of the copy-first extraction, CF-QAT-REPO-002).
# Independent of the legacy root Cargo.toml in this repository (not a member of it).
[workspace]
resolver = "2"
members = [
    "chain-forge-core",
    "chain-forge-crypto",
    "chain-forge-p2p",
    "chain-forge-service",
    "chain-forge-keygen",
    "chain-forge-vca-pq",
    "chain-forge-consensus",
    "chain-forge-identity",
    "chain-forge-validators",
    "chain-forge-slashing",
    "chain-forge-governance",
    "chain-forge-personhood",
]

[workspace.package]
version     = "0.1.0"
edition     = "2021"
authors     = ["cluna80"]
license     = "MIT"
repository  = "https://github.com/cluna80/chain-forge-frontend"

[workspace.dependencies]
tokio       = { version = "1", features = ["full"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
sha2        = "0.10"
sha3        = "0.10"
hex         = "0.4"
thiserror   = "1"
async-trait = "0.1"
tracing     = "0.1"
uuid        = { version = "1", features = ["v4", "serde"] }
chrono      = { version = "0.4", features = ["serde"] }
